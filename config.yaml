model_config:
  gnn:
    hidden_channels: 64
    num_layers: 3
    dropout: 0.3
    learning_rate: 0.001
    
  llm:
    model_name: "microsoft/phi-2"
    max_length: 512
    temperature: 0.7
    
  rl:
    algorithm: "PPO"
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    
supply_chain_config:
  num_suppliers: 20  # Reduced for faster testing
  num_warehouses: 10
  num_retailers: 30
  num_products: 10
  simulation_days: 100